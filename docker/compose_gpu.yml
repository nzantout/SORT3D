services:
  ubuntu22_ros:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubuntu22_ros
    privileged: true
    stdin_open: true
    tty: true
    working_dir: /home/$USER/SORT3D
    network_mode: "host"
    ipc: "host"
    # Enabling Nvidia GPUs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # Environment variables passed to the container
    environment:
      - "DISPLAY"
      - "QT_X11_NO_MITSHM=1"
      - XAUTHORITY=/tmp/.docker.xauth
      - HOST_USER=${USER}
    # This mounts the host directories into the container 
    volumes:
      # This mounts the X11 socket into the container so that GUIs can be displayed
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /etc/localtime:/etc/localtime:ro
      - /dev/input:/dev/input
      - /dev/bus/usb:/dev/bus/usb:rw
      - /home/$USER:/home/$USER:rw
      # - /dev/shm:/dev/shm
